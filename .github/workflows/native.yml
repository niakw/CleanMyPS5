name: Build installable PS5 native title (unverified hardware)
on:
  push:
    branches: [main]
    paths:
      - native/**
      - tests/test_native_protocol.cpp
      - tests/test_native_overview_protocol.cpp
      - tests/test_native_navigation.cpp
      - tests/test_cleanup_readiness.cpp
      - native/cleanup_readiness.hpp
      - tests/test_gallery_thumbnail.c
      - tests/test_gallery_thumbnail.py
      - tests/test_gallery_thumbnail_denied.c
      - tests/test_gallery_thumbnail_backup.c
      - tests/test_gallery_thumbnail_backup.py
      - tests/test_recovery_inventory.c
      - tests/test_recovery_resume.cpp
      - tests/test_private_capsule_inventory.cpp
      - tests/test_native_private_rehearsal.c
      - tests/test_private_workspace_capacity.c
      - tests/test_group_transaction_lock.c
      - tests/test_group_transaction_lock.py
      - tests/test_private_quarantine.c
      - tests/test_private_quarantine.py
      - src/native/private_quarantine.c
      - src/native/private_quarantine.h
      - tests/render_native_preview.py
      - tests/native_mock/**
      - src/native/**
      - rules/**
      - web/**
      - Makefile
      - VERSION
      - scripts/embed_assets.py
      - scripts/embed_rules.py
      - scripts/build_native_app.sh
      - scripts/check_privileged_surface.py
      - tests/test_privileged_surface.py
      - scripts/build_embedded_compression_engine.sh
      - scripts/patch_embedded_engine.py
      - scripts/verify_embedded_engine_policy.py
      - src/native/compression_allowed_paths.h
      - tests/test_compression_allowed_paths.c
      - tests/test_ampr_plan_hash.c
      - tests/test_compression_stream.cpp
      - tests/test_compression_bridge.cpp
      - tests/test_compression_preflight.cpp
      - native/compression_preflight.hpp
      - native/compression_progress.hpp
      - tests/test_compression_progress.cpp
      - native/compression_image.hpp
      - tests/test_compression_image.cpp
      - docs/GAME_COMPRESSION.md
      - scripts/enable_verified_zlib_mirrors.py
      - tests/test_verified_zlib_mirrors.py
      - scripts/fetch_stb_decoder.sh
      - scripts/enable_native_preview_blit.py
      - native/preview_decode.c
      - native/preview_decode.h
      - tests/test_photo_preview.c
      - tests/test_photo_preview.py
      - tests/test_video_metadata.py
      - tests/test_video_metadata.c
      - src/native/media_preview.c
      - src/native/media_preview.h
      - scripts/enable_interactive_videoout.py
      - tests/test_interactive_videoout.py
      - scripts/native_release_manifest.py
      - scripts/release_readiness.py
      - tests/test_native_release_manifest.py
      - tests/test_release_readiness.py
      - scripts/check_native_bundle.py
      - scripts/make_native_icon.py
      - .github/workflows/native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 lld-18 clang-format-18 make python3 python3-venv python3-pil git unzip zip curl wget pkg-config
      - name: Validate pinned zlib SHA-256 fallback safeguards
        run: python3 tests/test_verified_zlib_mirrors.py
      - name: Verify native VideoOut keeps presenting interactive frames
        run: python3 tests/test_interactive_videoout.py
      - name: Audit privilege and filesystem mutation surface
        run: python3 tests/test_privileged_surface.py
      - name: Run strict native response-framing regression
        run: |
          clang++-18 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. tests/test_native_protocol.cpp -o /tmp/cmp5-protocol
          /tmp/cmp5-protocol
      - name: Ensure embedded packer refuses arbitrary system and save paths
        run: |
          clang-18 -std=c11 -Wall -Wextra -Wpedantic -Werror tests/test_compression_allowed_paths.c -o /tmp/cmp5-compression-paths
          /tmp/cmp5-compression-paths
      - name: Verify managed image title identities and reject opaque formats
        run: |
          clang++-18 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. tests/test_compression_image.cpp -o /tmp/cmp5-compression-image
          /tmp/cmp5-compression-image
      - name: Validate small read-only AMPR compression-progress decoder
        run: |
          clang++-18 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. tests/test_compression_progress.cpp -o /tmp/cmp5-compression-progress
          /tmp/cmp5-compression-progress
      - name: Verify strict AMPR per-game compatibility and destination preflight
        run: |
          clang++-18 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. tests/test_compression_preflight.cpp -o /tmp/cmp5-compression-preflight
          /tmp/cmp5-compression-preflight
      - name: Reject invalid, cancelled or unsafe embedded ELF streams
        run: |
          clang++-18 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. tests/test_compression_stream.cpp -o /tmp/cmp5-compression-stream
          /tmp/cmp5-compression-stream
      - name: Reject spoofed or malformed compression-engine status
        run: |
          clang++-18 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. tests/test_compression_bridge.cpp -o /tmp/cmp5-compression-bridge
          /tmp/cmp5-compression-bridge
      - name: Validate strict native overview framing and counters
        run: |
          clang++-18 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. tests/test_native_overview_protocol.cpp -o /tmp/cmp5-overview-protocol
          /tmp/cmp5-overview-protocol
      - name: Validate category-wide cleanup readiness and hard deletion boundary
        run: |
          clang++-18 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. \
            tests/test_cleanup_readiness.cpp -o /tmp/cmp5-cleanup-readiness
          /tmp/cmp5-cleanup-readiness
      - name: Simulate native DualSense navigation without console
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -pthread             -Itests/native_mock -Isrc/native tests/test_native_navigation.cpp             -o /tmp/cmp5-native-navigation
          /tmp/cmp5-native-navigation
      - name: Render thirty-nine preview screens without a PS5
        run: |
          mkdir -p dist/ui-traces
          CMP5_NATIVE_PREVIEW_DIR=dist/ui-traces /tmp/cmp5-native-navigation
          python3 tests/render_native_preview.py dist/ui-traces dist/native-ui-preview
          test "$(find dist/native-ui-preview -name '*.png' | wc -l)" -eq 39
      - name: Validate cross-directory gallery thumbnail evidence without writes
        run: |
          clang-18 -std=c11 -Wall -Wextra -Wpedantic -Werror -Isrc/native \
            tests/test_gallery_thumbnail.c src/native/capture_companions.c \
            -o /tmp/cmp5-gallery-thumbnail
          clang-18 -std=c11 -Wall -Wextra -Wpedantic -Werror -Isrc/native \
            tests/test_gallery_thumbnail_denied.c \
            -o /tmp/cmp5-gallery-thumbnail-denied
          python3 tests/test_gallery_thumbnail.py \
            /tmp/cmp5-gallery-thumbnail /tmp/cmp5-gallery-thumbnail-denied
      - name: Verify private Gallery backup includes cross-tree thumbnail
        run: |
          clang-18 -std=c11 -Wall -Wextra -Wpedantic -Werror -Isrc/native \
            tests/test_gallery_thumbnail_backup.c \
            src/native/capture_companions.c src/native/verified_group.c \
            src/native/verified_backup.c src/native/sha256.c \
            -o /tmp/cmp5-gallery-private-backup
          python3 tests/test_gallery_thumbnail_backup.py /tmp/cmp5-gallery-private-backup
      - name: Exercise PS5 backup-only group engine on synthetic private media
        run: |
          clang-18 -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DCMP5_NATIVE_GROUP_BACKUP_ONLY=1 -DCMP5_NATIVE_BACKUP_ONLY=1 -Isrc/native \
            tests/test_native_group_backup.c src/native/capture_companions.c \
            src/native/verified_group.c src/native/verified_backup.c \
            src/native/sha256.c -o /tmp/cmp5-native-groups
          python3 tests/test_native_group_backup.py /tmp/cmp5-native-groups
      - name: Verify offline AMPR checkpoint inventory on removable volumes
        run: |
          clang-18 -std=c11 -Wall -Wextra -Wpedantic -Werror -Isrc/native \
            tests/test_recovery_inventory.c -o /tmp/cmp5-recovery-inventory
          /tmp/cmp5-recovery-inventory
      - name: Validate explicit post-restart checkpoint resume policy
        run: |
          clang++-18 -std=c++20 -Wall -Wextra -Wpedantic -Werror -Isrc/native \
            tests/test_recovery_resume.cpp -o /tmp/cmp5-recovery-resume
          /tmp/cmp5-recovery-resume
      - name: Validate bounded read-only native capsule inventory
        run: |
          clang++-18 -std=c++20 -Wall -Wextra -Wpedantic -Werror -Isrc/native \
            tests/test_private_capsule_inventory.cpp -o /tmp/cmp5-private-capsule-inventory
          /tmp/cmp5-private-capsule-inventory
      - name: Fail closed on insufficient space for private backup and restore
        run: |
          clang-18 -std=c11 -Wall -Wextra -Wpedantic -Werror -Isrc/native \
            tests/test_private_workspace_capacity.c -o /tmp/cmp5-private-capacity
          /tmp/cmp5-private-capacity
      - name: Verify independent group backups and restores cannot overlap
        run: |
          clang-18 -std=c11 -Wall -Wextra -Wpedantic -Werror -Isrc/native \
            tests/test_group_transaction_lock.c src/native/verified_group.c \
            src/native/capture_companions.c src/native/verified_backup.c \
            src/native/sha256.c -o /tmp/cmp5-group-locks
          python3 tests/test_group_transaction_lock.py /tmp/cmp5-group-locks
      - name: Verify private-only quarantine and recovery lifecycle
        run: |
          clang-18 -std=c11 -Wall -Wextra -Wpedantic -Werror -Isrc/native \
            tests/test_private_quarantine.c src/native/private_quarantine.c \
            src/native/verified_backup.c src/native/sha256.c \
            -o /tmp/cmp5-private-quarantine
          python3 tests/test_private_quarantine.py /tmp/cmp5-private-quarantine
      - name: Validate JPEG/PNG decoding and anchored photo snapshots
        run: |
          bash scripts/fetch_stb_decoder.sh /tmp/cmp5-stb
          python3 tests/test_photo_preview.py /tmp/cmp5-stb
      - name: Validate bounded MP4 metadata on synthetic gallery videos
        run: python3 tests/test_video_metadata.py
      - name: Reject tampered or unsafe homebrew archives
        run: python3 tests/test_native_release_manifest.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build genuine native eboot title and verify metadata
        env:
          CMP5_BUILD_FFPKG: '1'
        run: |
          bash scripts/build_native_app.sh
          test -s dist/native/PPSA99784.ffpkg
          # Both executable helpers must be packaged as inert title assets.
          # Nothing separately installed/downloaded to run this app.
          test ! -e dist/native/cleanmyps5-helper.elf
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          folder = Path("dist/native")
          manifest = json.loads((folder / "manifest.json").read_text())
          assert {x["name"] for x in manifest["files"]} == {
              "PPSA99784.zip", "PPSA99784.ffpkg"
          }
          with ZipFile(folder / "PPSA99784.zip") as package:
              members = set(package.namelist())
              assert "PPSA99784/assets/cleanmyps5-helper.elf" in members
              assert "PPSA99784/assets/cleanmyps5-compression.elf" in members
          PY
      - name: Write evidence-restricted release readiness report
        run: |
          python3 tests/test_release_readiness.py
          python3 scripts/release_readiness.py dist/native/manifest.json dist/native/release-readiness.json
          test -s dist/native/release-readiness.json
      - name: Publish a single ID-named installation archive
        uses: actions/upload-artifact@v4
        with:
          name: PPSA99784-native-title-unverified-on-13-60
          path: |
            dist/native/PPSA99784.zip
            dist/native/PPSA99784.ffpkg
            dist/native/manifest.json
            dist/native/release-readiness.json
          if-no-files-found: error
      - name: Publish host-only native UI previews
        uses: actions/upload-artifact@v4
        with:
          name: CleanMyPS5-native-UI-preview-not-hardware
          path: dist/native-ui-preview/
          if-no-files-found: error
