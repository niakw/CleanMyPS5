name: Build installable PS5 native title (unverified hardware)
on:
  push:
    branches: [main]
    paths:
      - native/**
      - tests/test_native_protocol.cpp
      - tests/test_native_navigation.cpp
      - tests/native_mock/**
      - src/native/**
      - rules/**
      - web/**
      - Makefile
      - VERSION
      - scripts/embed_assets.py
      - scripts/embed_rules.py
      - scripts/build_native_app.sh
      - scripts/native_release_manifest.py
      - tests/test_native_release_manifest.py
      - scripts/check_native_bundle.py
      - scripts/make_native_icon.py
      - .github/workflows/native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 lld-18 clang-format-18 make python3 python3-venv git unzip zip curl wget pkg-config
      - name: Run strict native response-framing regression
        run: |
          clang++-18 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. tests/test_native_protocol.cpp -o /tmp/cmp5-protocol
          /tmp/cmp5-protocol
      - name: Simulate native DualSense navigation without console
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -pthread             -Itests/native_mock -Isrc/native tests/test_native_navigation.cpp             -o /tmp/cmp5-native-navigation
          /tmp/cmp5-native-navigation
      - name: Reject tampered or unsafe homebrew archives
        run: python3 tests/test_native_release_manifest.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build genuine native eboot title and verify metadata
        env:
          CMP5_BUILD_FFPKG: '1'
        run: |
          bash scripts/build_native_app.sh
          test -s dist/native/PPSA99784.ffpkg
      - name: Publish a single ID-named installation archive
        uses: actions/upload-artifact@v4
        with:
          name: PPSA99784-native-title-unverified-on-13-60
          path: |
            dist/native/PPSA99784.zip
            dist/native/PPSA99784.ffpkg
            dist/native/cleanmyps5-helper.elf
            dist/native/manifest.json
          if-no-files-found: error
