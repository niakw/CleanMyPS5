name: One-time branch consolidation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  prune-merged-branches:
    if: github.repository == 'niakw/CleanMyPS5'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove exactly two verified merged PR branches
        shell: bash
        run: |
          set -euo pipefail
          prune() {
            local pr="$1"
            local branch="$2"
            local expected="$3"
            local merged
            merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.merged')"
            test "$merged" = "true" || { echo "PR not merged: $pr"; exit 1; }
            local actual
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            if [ "$actual" != "$expected" ]; then
              echo "Branch head changed: $branch (refusing deletion)"
              exit 1
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted merged branch: $branch"
          }
          prune 1 codex/generic-analysis-single-elf 5b19679ada5e991e11a86e0dd06f6d73f1df6626
          prune 2 codex/fix-duplicates-root-race 86e26a04bef0965e7f9a7491adad10fc7f34ce76
