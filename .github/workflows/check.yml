name: Validate read-only preview
on:
  push:
    branches: [main]
  pull_request:
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build portable C runtime
        run: cmake --build build --parallel 2
      - name: Native HTTP and scanner fixtures
        run: ctest --test-dir build --output-on-failure
      - name: JavaScript syntax
        run: node --check web/app.js
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan --parallel 2
      - name: Run native request and filesystem safety regression
        run: ctest --test-dir build-asan --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  ps5-payload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM and payload SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 lld-18 unzip
          curl -fL --retry 2 -o /tmp/ps5-payload-sdk.zip https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt
          test -x /opt/ps5-payload-sdk/bin/prospero-clang
      - name: Cross-compile PS5 ELF (no on-console claim)
        run: make ps5
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: cleanmyps5-ps5-elf-untested
          path: |
            cleanmyps5.elf
            VERSION
          if-no-files-found: error
