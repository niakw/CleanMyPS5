name: Validate CleanMyPS5
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build portable C runtime
        run: cmake --build build --parallel 2
      - name: Validate pinned zlib SHA-256 fallback safeguards
        run: python3 tests/test_verified_zlib_mirrors.py
      - name: Verify native VideoOut keeps presenting interactive frames
        run: python3 tests/test_interactive_videoout.py
      - name: Native HTTP and scanner fixtures
        run: ctest --test-dir build --output-on-failure
      - name: Verify native title loopback protocol
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. tests/test_native_protocol.cpp -o build/test-native-protocol
          ./build/test-native-protocol
      - name: Check tracked paths and credentials
        run: python3 scripts/check_repository_hygiene.py
      - name: Prevent external branding in tracked tree
        run: python3 scripts/check_branding.py
      - name: Reject private data accidentally committed to the tracked tree
        run: python3 scripts/audit_privacy.py --history
      - name: Audit reachable Git history (redacted, informational)
        run: python3 scripts/audit_history.py
      - name: Simulate native DualSense navigation without console
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -pthread             -Itests/native_mock -Isrc/native tests/test_native_navigation.cpp             -o /tmp/cmp5-native-navigation
          /tmp/cmp5-native-navigation
      - name: Native archive integrity fixture
        run: python3 tests/test_native_release_manifest.py
      - name: Verify release gates do not claim untested PS5 compatibility
        run: python3 tests/test_release_readiness.py
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: JavaScript data validation and ordering tests
        run: node tests/test_ui.js
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan --parallel 2
      - name: Run native request and filesystem safety regression
        run: ctest --test-dir build-asan --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  macos-host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure macOS host build
        run: cmake -S . -B build-mac -DCMAKE_BUILD_TYPE=Release
      - name: Build portable scanner on macOS
        run: cmake --build build-mac --parallel 2
      - name: Run read-only macOS fixtures
        run: ctest --test-dir build-mac --output-on-failure
      - name: Run JS validation on macOS
        run: node tests/test_ui.js
  ps5-payload:
    needs: [host, sanitizer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM and payload SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 lld-18 unzip
          curl -fL --retry 2 -o /tmp/ps5-payload-sdk.zip https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt
          test -x /opt/ps5-payload-sdk/bin/prospero-clang
      - name: Cross-compile PS5 ELF (no on-console claim)
        run: make package
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
      - name: Verify payload artifact and generate checksum
        run: |
          test -s cleanmyps5.elf
          file cleanmyps5.elf
          sha256sum cleanmyps5.elf > cleanmyps5.elf.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cleanmyps5-single-elf-analysis-untested
          path: |
            dist/CleanMyPS5-elf.zip
            cleanmyps5.elf.sha256
            VERSION
          if-no-files-found: error
