<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>CleanMyPS5 — Nettoyage intelligent</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Sections">
      <a class="brand" href="#overview" aria-label="CleanMyPS5, accueil">
        <span class="brand-symbol" aria-hidden="true"><span></span><span></span><span></span></span>
        <span><strong>CleanMy<span>PS5</span></strong><small>STORAGE CARE</small></span>
      </a>
      <span class="side-label">ESPACE DE TRAVAIL</span>
      <nav id="navigation" aria-label="Navigation principale">
        <button class="nav-item focusable active" data-tab="overview"><span class="nav-icon">◈</span> Vue d'ensemble</button>
        <button class="nav-item focusable" data-tab="media"><span class="nav-icon">▧</span> Captures & vidéos</button>
        <button class="nav-item focusable" data-tab="cache"><span class="nav-icon">◎</span> Caches & journaux</button>
        <button class="nav-item focusable" data-tab="residuals"><span class="nav-icon">▤</span> Installations</button>
        <button class="nav-item focusable" data-tab="storage"><span class="nav-icon">◫</span> Stockage</button>
      </nav>
      <div class="sidebar-bottom"><div class="shield-icon">✓</div><div><strong>Protection active</strong><small>Lecture seule · aucune suppression</small></div></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><span>UTILITAIRES</span><span class="chevron">›</span><strong id="breadcrumb">Vue d'ensemble</strong></div>
        <div class="header-actions">
          <span class="console-state"><span class="status-dot"></span><span id="source-label">Aucun scan chargé</span></span>
          <span class="build-tag">PREVIEW 0.1</span>
        </div>
      </header>
      <main id="content" tabindex="-1" aria-live="polite"></main>
      <footer class="controller-footer" aria-label="Commandes">
        <span><kbd>✕</kbd> Sélectionner</span><span><kbd>◯</kbd> Retour</span>
        <span><kbd>L1</kbd><kbd>R1</kbd> Sections</span>
        <span class="footer-end">CleanMyPS5 • v0.1 • mode sécurisé</span>
      </footer>
    </div>
  </div>
  <input type="file" id="report-input" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
